resolved_2026-09-07:
  frame_budget_ms:
    was: 250, chosen against token-shaped arrival
    now: 100, approved by the user
    measured: >-
      Coalescing only saves bytes when frames arrive faster than the budget, so
      its cost depends entirely on arrival shape. Against the rendered document
      on a 20KB message - token 4ch/25ms: 3.03x / 2.34x / 1.65x / 1.08x at
      60/100/150/250ms; batch 40ch/200ms: 1.07x at every budget except 0.89x at
      250ms; step 2000ch/1s: 1.17x at every budget. Under the batched arrival
      this engine is built for the budget buys nothing, and 250ms was merging
      two steps into one frame.
    cost: >-
      A host whose model emits token by token now pays 2.34x against a 1.5x
      budget and should raise its own frame_budget_ms. Pinned by its own test in
      broadcaster_test.rb rather than hidden - all three rows are asserted.
  tool_call_shape:
    decided: separate Streamable record, by the user
    built: >-
      test/dummy/app/models/message.rb holds the whole bridge; nexo_test.rb
      drives it against a real Nexo::Agent. The deciding case is a tool result
      that arrives late: as a block it rewrites the middle of a message whose
      tail has moved on, which is what the seal lag cannot cover. As a record it
      is just another stream, still open. Two open at once is also what a
      parallel tool call is, and the block shape cannot represent it.

measurements:
  history_500_messages: { render_ms: 387, per_message_ms: 0.77, html_kb: 2071, objects: 1891041, warm_ms: 289 }
  sealed_message_cache: { cold_ms: 95.04, cached_ms: 0.049, speedup: 1942, page_of_50_uncached_ms: 4752, page_of_50_cached_ms: 2.4 }
  arrival_shape_20kb:
    note: "measured after the user said responses may be batched and sessions are short (Nexo)"
    token_4ch_25ms:   { frames: 474, vs_floor: 1.25, cpu_ms: 8740 }
    batch_40ch_200ms: { frames: 238, vs_floor: 1.04, cpu_ms: 4282 }
    step_2000ch_1s:   { frames: 11,  vs_floor: 1.26, cpu_ms: 253 }
    one_shot:         { frames: 2,   vs_floor: 1.28, cpu_ms: 65 }
    conclusion: >-
      Bandwidth is near-invariant (1.04-1.32x) because the document must be sent
      once either way. CPU is where batching pays: 35x from token to step shape.
      The quadratic-render risk largely disappears under Nexo-shaped arrival.

resolved_divergence:
  was: >-
    A block that sealed after it stopped being the tail kept presentation chrome
    - data-ms-reveal, data-ms-caret, data-ms-block-state="open" - which a
    manifest digest cannot see, because the digest covers content.
  how_it_surfaced: >-
    The multi-tab test. Two tabs losing DIFFERENT frames ended up visibly
    different - one with a caret, one without - and repair could not reconcile
    them because their digests agreed. Stale-until-reload was tolerable; two
    tabs disagreeing was not.
  fixed_by: >-
    Removing per-block chrome entirely. Blocks carry content, id, index and
    digest; the caret and reveal are derived in CSS from the message element
    ([data-ms-streaming] > [data-ms-block]:last-child). Paying to correct chrome
    through the delta path was measured first and cost a full extra copy of the
    message (1.248x -> 2.41x), which is why deriving beats correcting.
  consequence: >-
    mode: no longer changes renderer output. Live, reload, replay and export are
    byte-identical, and replay parity is now asserted exactly instead of on
    content only. Third and final change to the DOM contract, recorded in
    docs/api-surface.md.

open:
  - "Release steps: both remotes are configured (github.com/maquina-app) and 0.1.0 is bumped with a changelog, but NOTHING IS PUSHED and nothing is released. maquina_stream depends on maquina_remend by path, so remend has to ship first. Awaiting the user."
  - "Extraction: two of the three couplings are gone (2026-09-07). The data-ms-* contract attributes, the ms-* Stimulus identifiers and the maquina_stream.* labels are now supplied at the call site by MaquinaStream::Components::Contract (lib/maquina_stream/components/contract.rb), which both callers use - the component helper and the fence renderer. A test fails if a vendored partial names any of them. What remains is component_html_options: the conventions helper the partials are written against. It cannot become a local - it is behaviour invoked on every render, and it is precisely the maquina_components house-style API - so it travels WITH the partials rather than blocking them. Until it is published there, the vendored copies depend on the engine's copy. See docs/component-scope.md."
