known_divergence:
  what: >-
    A block that seals AFTER it stops being the tail keeps presentation chrome
    on the client - data-ms-reveal, and data-ms-block-state="open" - because a
    block's manifest digest covers its content and deliberately ignores chrome.
  why_not_fixed: >-
    Two fixes were measured and both cost a full extra copy of the message.
    Re-sending at the tail handover took bandwidth from 1.248x to 2.41x of the
    rendered document, against a 1.5x budget; a full keyframe at seal costs the
    same. Content is correct in every case - only presentation lags, and the
    next reload corrects it.
  alternative: >-
    Move data-ms-reveal and the caret off individual blocks and onto the message
    element, deriving per-block appearance in CSS from :last-child. That removes
    the staleness rather than paying to correct it, and would be a third change
    to the DOM contract.

