    verification: >-
      broadcaster_test.rb streams the corpus through the broadcast recorder and
      asserts no id that is sealed in the final document appears in a later
      frame. Patching is restricted to the open tail, so a block stops being
      sent the moment it stops being the tail.
  - line: Retroactive corpus passes in full and is in CI.
    met: true
    verification: >-
      sealing_test.rb replays all ten retroactive documents character by
      character (2,460 assertions) and asserts a sealed block's HTML never
      changes again. It failed when written: a link reference definition
      rewrote block 0 from 294 characters away.
  - line: Bandwidth ratio measured against rendered size, recorded in the spec, with a test that fails on regression.
