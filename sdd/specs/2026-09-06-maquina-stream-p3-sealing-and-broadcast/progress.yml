design_changes:
  - "The seal pointer stops at a block with an unresolved link reference definition. A definition resolves links arbitrarily far above it, so no fixed seal lag makes those blocks safe. A definition counts only once its line is complete - '[docs]:' resolves nothing, and '[docs]: https://exa' resolves to a truncated host."
  - "Coalescing happens before the render, not after. Building a frame renders the whole buffer, so doing it per token and discarding the result is what makes a stream quadratic."
  - "Frame#patch is a list, and carries only the open tail. Patching every unsealed block re-sent the whole tail region per frame (10.6x); changes to unsealed non-tail blocks are left to the repair path, which is where the design says correctness lives."
  - "maquina_stream_advance added to the Streamable contract: the sequence lives in the host's row and is incremented there atomically, which is also what keeps it monotonic under concurrent appends."
