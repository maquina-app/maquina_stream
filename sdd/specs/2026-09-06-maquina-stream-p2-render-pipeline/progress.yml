measurements:
  tests: "189 runs, 5711 assertions, 0 failures"
  fence_500_lines: "closed fence renders inside the 60ms frame budget; open fence is measurably cheaper because it is not highlighted"
  inline_colour: "none - asserted over the corpus; themes are two generated stylesheets"

contract_changes:
  - "The raw-source carrier moved from <script type=\"text/plain\"> to <pre hidden>. The sanitizer drops every script element and must: it cannot tell our carrier from an imitation, and Nokogiri's HTML5 serializer writes script children unescaped, so a fence containing </script><img> would break out on the next parse. Escaping upstream is worse - the escape travels into whatever the copy button returns."
  - "config.themes default corrected: Rouge defines github.light and github.dark, never github_dark."
  - "Client payloads JSON-escape < and > as \\u003c / \\u003e; the HTML5 attribute serializer leaves them raw."
  - "Sanitizer allows the hidden attribute (a carrier that loses it renders every code block twice) and data-<component>-part styling hooks."

known_gaps:
  - "data-controller / data-ms-* provenance: the sanitizer runs over already-merged HTML and cannot tell an attribute the post-pass emitted from one an injected fragment asked for. It restricts identifiers to the ms- namespace. Mitigation is client-side - every ms- controller must treat its values as untrusted. Documented in docs/sanitizer.md."
  - "id is allowlisted because block ids need it, so injected markup can collide with ms-<sid>-bN or DOM-clobber a global. Not exploitable into script execution; can confuse morph targets. Unmitigated."
  - "maquina_components ships partials under app/views/components/, not app/views/maquina_components/. The resolver probes the exact path it would render so it never resolves to a missing partial, but the prefix has to be settled before those components actually ship."
