dod:
  - line: Rendered output survives repair, verified as an automated test.
    met: true
    verification: >-
      In-browser: a byte-identical payload after a morph triggers ZERO
      re-renders, a changed one triggers exactly one. The output element is
      data-turbo-permanent, so the morph does not touch it.
  - line: Renderer-side sanitization has its own regression suite, independent of the server's.
    met: true
    verification: >-
      A stub renderer returning hostile markup is driven in Chromium: script,
      iframe, onload and style stripped; javascript: href dropped while https:
      survives; nothing executes; legitimate SVG renders.
  - line: Heavy libraries load lazily, never on pages that don't need them.
    met: true
    verification: >-
      Confirmed in a Chromium network panel with the real libraries. mermaid
      11.4.1 and katex 0.16.11 are pinned host-side in test/dummy (CDN, exact
      version, preload: false - importmap-rails preloads by default and a
      preloaded pin would fetch both on every page). /harness/deferred puts each
      block behind its own 250vh spacer so a fetch is attributable to one block.
      1) /harness, no deferred block: 15 requests, zero to the CDN. The engine's
      own ms_diagram/ms_math controller files load - they are small and they are
      not the libraries. 2) /harness/deferred at scrollY 0, both blocks ~2,400px
      and ~6,000px down: still zero CDN requests. 3) scroll the diagram in:
      mermaid@11.4.1/+esm plus its dependency graph; katex not requested; the
      math block still shows its shimmer. 4) scroll the formula in:
      katex@0.16.11/dist/katex.mjs, after the mermaid request. 5) scroll out and
      back four times: each entry point still appears exactly once, one <svg>,
      zero console errors.
    found: >-
      The lazy path did not work, and only the real pins showed it. Stimulus
      invokes payloadValueChanged once as the context connects and passes as
      `previous` the value type's DEFAULT - {} for an Object - never undefined,
      so the `previous === undefined` guard never fired: the initial invocation
      read as a change, reset `rendered` and called render(). Both libraries
      were fetched at scrollY 0 with the blocks 4,500px down the page. Fixed by
      guarding on a `connected` flag set in connect(), which runs after the
      value observer starts. Re-verified: the morph behaviour the first DoD line
      depends on is unchanged - byte-identical payload = 0 draws, changed
      payload = exactly 1 - and the eager path (ms-hostile, eager-value=true)
      still renders on connect.
  - line: A host can add a renderer using only the documented registry, demonstrated in the dummy app.
    met: true
    verification: >-
      register_fence "timeline" with controller "ms-timeline" in the dummy app's
      initializer. The string ms-timeline appears nowhere in the engine, and the
      payload, controller and permanent output element all render correctly.
  - line: Export fallback decided, implemented once, applied to every deferred renderer.
    met: true
    verification: "ms-deferred#fail shows the source the model wrote; every subclass inherits it."

