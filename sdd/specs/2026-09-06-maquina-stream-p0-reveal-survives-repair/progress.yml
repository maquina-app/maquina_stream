    pixel_evidence: >-
      docs/phase0-frames/pixel-evidence.md, reproducible with analyse.sh. Frames
      cropped to their top 200px - text revealed long before the snapshot - and
      diffed against the frame before. After the snapshot A and B are
      PIXEL-IDENTICAL frame to frame (0 px), and C differs by 25-58 px, about
