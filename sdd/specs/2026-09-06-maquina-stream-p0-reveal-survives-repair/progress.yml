      strategy is the snapshot's reflow, not a strobe: it appears at equal
      magnitude in C, which cannot re-animate old text by construction, and all
      three frames jump to the same height at that moment. This settles the
      factual question with pixels; it does not settle the judgement.

dod:
  - line: One strategy chosen, reason written in the spec.
    met: true
    verification: >-
      Human review 2026-09-07, live against the spike at localhost:3002 with 20%
      of delta frames dropped. NONE OF THE THREE SHIPS AS WRITTEN. The reviewer
      preferred B on looks and could not distinguish A from B; A and B are both
      over the plan's node-count and patch-time budgets, and the reviewer then
      found a defect in C. What ships is C's granularity with C's geometry
      replaced: the newly-arrived tail text is wrapped in one element, faded in,
      and unwrapped when the animation ends. See reveal_decision below.
  - line: Specific failing behaviour of each rejected strategy documented, not just "worse".
    met: true
    verification: rejected_strategies below; each entry is a behaviour, measured or observed, not a preference.
  - line: Suppression mechanism described concretely enough for Phase 4 to implement against.
    met: true
    verification: >-
      Built and in use before the gate closed: ms-repair dispatches ms:suppress
      before the repair morph and ms:resume after it, on the message element.
      Events rather than method calls, so the strategy can change without the
      repair path changing. On resume the reveal resets its revealed length to
      the current text length, which is what stops a repair from re-revealing
      text already on screen.
  - line: Reduced-motion path confirmed.
    met: true
    verification: >-
      prefers-reduced-motion emulated in Chromium: 0 animationstart events and
      the complete message rendered, on all three strategies.

