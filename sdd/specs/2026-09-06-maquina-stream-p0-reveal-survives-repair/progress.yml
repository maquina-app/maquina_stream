reveal_decision:
  reviewed: 2026-09-07
  reviewer: human, live against ms-spike with drop_percent 20
  chosen: >-
    Tail-wrap reveal. C's granularity - one element, no per-word nodes - with C's
    mask geometry removed. The client wraps the newly-arrived trailing text of a
    block in a single element, fades it in, and UNWRAPS it on animationend so no
    reveal chrome is left in the DOM for a block digest to disagree about.
  why_not_a_pure_phase_0_strategy: >-
    Because none of the three is both correct and affordable. A and B are correct
    in reading order and cost about 10,100 reveal-added nodes against a budget of
    8,000; C costs none and reveals in the wrong order.
  rejected_by_the_server_too: >-
    Marking the new text server-side would be free on the client - the broadcaster
    knows the delta exactly - but it puts reveal chrome inside the block's HTML,
    and a block's digest covers its content. The chrome becomes drift the repair
    path cannot see, which is the two-tabs-disagree bug the Phase 7 chrome removal
    fixed. Client-side wrap-then-unwrap leaves nothing behind.
  fallback_if_the_walk_is_too_slow: >-
    Fade each whole block in as it first appears, with no reveal inside a block.
    Zero added nodes and no text-node walk, at the cost of text arriving in
    paragraph-sized chunks.

rejected_strategies:
  a:
    what: id-keyed per-word spans, morphed
    failure: >-
      10,103 reveal-added DOM nodes on a 20KB message against a budget of 8,000,
      and a 248ms patch max against a budget of 30ms - the worst maximum of the
      three. Its only advantage over C is a per-word fade the reviewer could not
      distinguish from B's.
  b:
    what: MutationObserver reveal controller
    failure: >-
      The only strategy that flashes the whole message on every snapshot morph
      without the suppression seam - confirmed by the reviewer, who turned
      suppression off and watched the content flash. It also destroys node
      identity across a morph, and is over budget on node count (10,101), patch
      median (42.7ms against 8ms) and patch max (147.8ms against 30ms).
  c:
    what: CSS-masked block reveal
    failure: >-
      Reveals in the wrong order. The controller sets the mask position from
      revealedLength / textContent.length - a CHARACTER fraction - while the CSS
      is a linear-gradient(90deg, ...), which hides by HORIZONTAL POSITION. The
      two are unrelated once a block wraps. Measured on a 3-visual-line block in
      the spike: every line's text ends at ~94% of the block width, so with the
      mask edge at 75% the last ~19% of EVERY line is hidden and swept back in -
      including the first line, read seconds earlier. It disappears as the block
      grows only because revealedLength/length approaches 100% and the swept
      strip shrinks, which is exactly what the reviewer saw: "C flashes a little
      bit at the end of the 3 first rows, after that I see no flashes."
    instrumentation_was_blind_to_it: >-
      The animation counter asserts that no element already marked revealed began
      an animation. C has ONE element, so "old text re-animated" was structurally
      always zero. The pixel evidence did see it - 25-58px per frame after the
      snapshot - and it was recorded as "the mask's gradient edge", an artifact,
      rather than as the bug it is. A counter that cannot fail is not evidence.

shipped:
  what: app/javascript/maquina_stream/controllers/ms_reveal_controller.js + app/assets/stylesheets/maquina_stream/reveal.css
  gap_it_closed: >-
    docs/api-surface.md listed an ms-reveal controller and the engine shipped
    none. The Phase 7 chrome removal left a documented CSS hook with nothing
    behind it, so every message rendered with no reveal at all.
  verification: >-
    Chromium against test/dummy/app/views/harness/reveal.html.erb, on a block
    wrapping over TEN visual lines - the shape that breaks the mask. Twelve
    consecutive deltas produced twelve animationstart events, every one on a
    span[data-ms-revealing] holding EXACTLY the text just appended, and the
    client rects of all nine preceding lines were byte-identical before and
    after every frame. Block node count 7 -> 7, spans left behind 0. A sealed
    message fired 0 animations across 5 appends; ms:suppress left 0 spans and 0
    running animations with the text intact, and ms:resume revealed only the new
    tail rather than the text suppressed during the morph; under emulated
    prefers-reduced-motion, 0 animations, 0 spans, opacity 1, all six deltas
    present.
  instrumentation_note: >-
    The harness records WHICH element animated, its text and its box, per
    animation. The Phase 0 counter recorded only that an element already marked
    revealed had not animated, which is why it was blind to C's defect. The
    measurement that matters is "did any text already on screen move or fade",
    and it is now asserted directly.
