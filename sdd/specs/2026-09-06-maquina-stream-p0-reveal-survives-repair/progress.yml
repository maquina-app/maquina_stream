  - id: 12
    title: backgrounded tab restore
    status: done
    verified: 2026-09-07
    note: >-
      Playwright fires no visibilitychange, and neither
      Emulation.setPageVisibilityOverride (removed from CDP) nor
      Page.setWebLifecycleState frozen produces one. Driven directly instead:
      the controller only ever READS document.hidden and LISTENS for
      visibilitychange, so overriding the property and dispatching the event
      exercises the same code path. Three fragments appended while hidden
      produced 0 animations; returning produced 0; the next genuinely new
      fragment animated alone, holding only its own text, and all three hidden
      fragments were present unrevealed. Then confirmed by the user in a REAL
      tab, 2026-09-07, after two false reports that were both the harness's
      fault: "BIEN: nada de lo oculto se volvió a revelar".
    harness_was_lying: >-
      The user's second report - "it stops streaming when I switch tab, but
      after I came back it does continue with animation" - was about the harness,
      not the engine. It drove the stream with setInterval, and a browser
      throttles timers in a hidden tab (Chrome to roughly once a minute), so the
      stream STOPPED the moment the reader looked away. Nothing arrived unseen,
      so nothing could be replayed, and what animated on return was simply the
      timer resuming. The harness now streams over server-sent events, which is
      what a real frame does: the server pushes, and a push reaches a hidden tab
      like any other. Re-measured through SSE: 233 characters across 5 fragments
      arrived while hidden, 3 animations fired after returning, and 0 of them
      held text that arrived unseen.
    false_alarm: >-
      The user reported "append animates after switching back", and the
      instrumentation was to blame rather than the controller. It counted any
      animation within a second of the tab becoming visible, and the first
      fragment to arrive after the reader returns IS new text, which is supposed
      to animate. The harness now numbers each fragment, records which ones
      arrived while hidden, and reports whether any animated span holds one of
      them - which is the only version of the question that separates correct
      from broken.
