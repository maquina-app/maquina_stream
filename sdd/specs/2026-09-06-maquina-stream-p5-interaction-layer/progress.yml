dod:
  - line: Full keyboard and screen reader pass completed with findings fixed, not logged.
    met: partial
    verification: >-
      Keyboard half DONE in Chromium against the harness: 17 controls, every one
      reachable, named and with a visible focus ring; copy returns raw source,
      table copy round-trips quotes and commas, the link dialog traps focus and
      restores it, autoscroll holds position through further frames. Findings
      were fixed, not logged - see found_in_the_browser below.
      An axe-core 4.10.2 audit (WCAG 2.0/2.1 A + AA) additionally reports ZERO
      violations on /harness, on /harness with the link dialog open, and on
      /history - which narrows what a person has to check.
      SCREEN READER HALF STILL NOT DONE and cannot be done by an agent: no
      session here drives VoiceOver, NVDA or JAWS, axe cannot tell whether what
      is announced makes sense, and asserting an aria-label exists is not
      hearing it. Needs a person, ~10 minutes at the harness.
  - line: Both locales complete, Spanish default.
    met: true
    verification: "config/locales/{es,en}.yml, 70 keys each; locales_test.rb fails the build on a key present in one and missing in the other."
  - line: Every control individually disableable via configuration.
    met: true
    verification: configuration_test.rb covers per-control and wholesale toggling.

found_in_the_browser:
  - "code_block accepted a `controls` local and never drew anything, so ms-code had nothing to bind to. Controls now render, with accessible names."
  - "The sanitizer dropped every <button>, so no control could have survived anyway. Button is now allowed with a short attribute list and type forced to \"button\"; name, formaction and on* stay dropped."
  - "The table wrapper mounted ms-table with no controls at all. The controller documents the markup it expects and emits none of it; the post pass now draws it."
  - "Controllers imported ./application_controller relatively, which 404s under importmap+propshaft. They use the pinned specifier now."

remaining_for_a_human:
  - "Screen reader pass at http://localhost:3001/harness."
  - "Clipboard in Firefox and Safari, including the insecure-context fallback (Chromium is covered)."
