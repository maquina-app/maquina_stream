found_in_the_browser:
  - "code_block accepted a `controls` local and never drew anything, so ms-code had nothing to bind to. Controls now render, with accessible names."
  - "The sanitizer dropped every <button>, so no control could have survived anyway. Button is now allowed with a short attribute list and type forced to \"button\"; name, formaction and on* stay dropped."
  - "The table wrapper mounted ms-table with no controls at all. The controller documents the markup it expects and emits none of it; the post pass now draws it."
  - "Controllers imported ./application_controller relatively, which 404s under importmap+propshaft. They use the pinned specifier now."

regression_found_and_fixed_2026-09-07:
  what: >-
    "Controls inert while streaming" was dead on both sides. The Phase 7 chrome
    change moved the caret off blocks, and ApplicationController#streaming still
    read data-ms-caret, so it reported "not streaming" for every message. The
    guard also disables [data-ms-control], which nothing emitted.
  how_found: >-
    Looking for reachable work on the Firefox/Safari clipboard line, not by any
    test. Nothing failed when it broke: the controls simply stayed live.
  fixed: >-
    The guard reads data-ms-streaming on the message element, every engine
    control carries data-ms-control, and controllers_test.rb now pins the
    marker. Browser-verified: 6/6 controls disabled while streaming, 0/6 sealed,
    and sealing re-enables them live.

browser_coverage:
  chromium: >-
    Automated, including the insecure-context fallback: with navigator.clipboard
    removed and isSecureContext false, copyText falls through to execCommand,
    copies the source exactly, and leaves no stray textarea.
  chrome: "Manual, by the user 2026-09-07. Works."
  safari: "Manual, by the user 2026-09-07. Works."
  firefox: >-
    NOT TESTED, and not testable here - the user has no Firefox installed. The
    risk is specific rather than general: Firefox gates navigator.clipboard.write
    behind a user gesture more strictly than Chromium, and our fallback path is
    only exercised when navigator.clipboard is absent, not when it rejects. If a
    Firefox report ever comes back, that is the first thing to look at.
